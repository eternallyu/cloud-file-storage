services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cloud_storage
    ports:
      - "5442:5432"
    networks:
      - application-network
    volumes:
      - postgres-data:/data
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    environment:
      MINIO_ROOT_USER: minio_user
      MINIO_ROOT_PASSWORD: password
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - application-network
    volumes:
      - minio-data:/data
    command:
      server /data --console-address ":9001"


networks:
  application-network:
    name: application-network
    driver: bridge

volumes:
  postgres-data:
  minio-data: