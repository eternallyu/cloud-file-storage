services:
  database:
    image: postgres:17
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cloud_storage
    ports:
      - "5442:5432"
    networks:
      - application-network

networks:
  application-network:
    name: application-network
    driver: bridge