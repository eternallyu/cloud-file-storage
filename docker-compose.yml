version: "3.8"

services:
  redis:
    image: redis:latest
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - application-network
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:17
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: db_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cloud_storage
    ports:
      - "5442:5432"
    networks:
      - application-network
    volumes:
      - postgres-data:/data

  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    environment:
      MINIO_ROOT_USER: minio_user
      MINIO_ROOT_PASSWORD: password
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - application-network
    volumes:
      - minio-data:/data
    command:
      server /data --console-address ":9001"

  app:
    image: eternallyu/cloud-file-storage:latest
    container_name: app
    restart: always
    depends_on:
      - postgres
      - minio
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cloud_storage
      SPRING_DATASOURCE_USERNAME: db_user
      SPRING_DATASOURCE_PASSWORD: password

      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: minio_user
      MINIO_SECRET_KEY: password
      MINIO_BUCKET: user-files

      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_SESSION_STORE_TYPE: redis

      SERVER_PORT: 8090
    ports:
      - "8090:8090"
    networks:
      - application-network

networks:
  application-network:
    driver: bridge

volumes:
  redis-data:
  postgres-data:
  minio-data:
