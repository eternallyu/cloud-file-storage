spring:
  application:
    name: cloud-file-storage
  datasource:
    password: password
    username: db_user
    url: jdbc:postgresql://localhost:5442/cloud_storage
    driver-class-name: org.postgresql.Driver
  jpa:
    properties.hibernate:
      show_sql: true
      format_sql: true
      hbm2ddl:
        auto: validate

server:
  port: 8090