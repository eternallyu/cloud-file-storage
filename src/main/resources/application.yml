spring:
  session:
    store-type: redis
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 1000MB
  application:
    name: cloud-file-storage
  datasource:
    username: db_user
    password: password
    url: jdbc:postgresql://localhost:5442/cloud_storage
    driver-class-name: org.postgresql.Driver
  jpa:
    properties.hibernate:
      show_sql: true
      format_sql: true
      hbm2ddl.auto: validate
  data:
    redis:
      host: redis
      port: 6379


minio:
  url: http://localhost:9000
  access-key: minio_user
  secret-key: password
  bucket: user-files

server:
  port: 8090